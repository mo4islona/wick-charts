    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wick Charts — High-performance timeseries charts for React, Vue, Svelte" />
    <meta name="twitter:description" content="Canvas-rendered candlestick, line, bar, pie, and sparkline charts. Real-time streaming at 60fps, 22 themes, tree-shakeable, zero runtime dependencies." />
    <meta name="twitter:image" content="https://wick-charts.eeff.io/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" />
    <script>
      // Pre-paint boot guard, must stay inline + blocking. The prerendered
      // HTML exists for crawlers; showing it to people causes a visible
      // double-render — its canvases are empty (canvas state can't be
      // serialized), so charts pop in and entry animations replay when React
      // takes over. Instead: paint the user's theme background before first
      // paint, keep the body hidden until the app has rendered the real page
      // once (App removes the class in its theme effect), and start the saved
      // theme's font download immediately so text doesn't reflow later.
      (() => {
        try {
          let bg = localStorage.getItem('chart-theme-bg');
          if (!bg || bg[0] !== '#' || bg.length < 7) {
            const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
            bg = dark ? '#1e1e2e' : '#f5f5f5';
          }
          document.documentElement.style.background = bg;
          document.documentElement.classList.add('theme-boot');
          // Failsafe: never leave the page blank if the app fails to mount.
          setTimeout(() => {
            document.documentElement.classList.remove('theme-boot');
          }, 4000);

          const r = parseInt(bg.slice(1, 3), 16);
          const g = parseInt(bg.slice(3, 5), 16);
          const b = parseInt(bg.slice(5, 7), 16);
          const light = (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5;

          // The dark default font (Outfit) is already in the static <link>
          // above; the light default falls back to Quiet Light's IBM Plex
          // Mono. Same id scheme as the App effect, so it won't re-add it.
          let name = localStorage.getItem('chart-theme');
          let fontUrl = localStorage.getItem('chart-theme-font');
          if (!name || !fontUrl) {
            name = light ? 'Quiet Light' : '';
            fontUrl = light
              ? 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap'
              : '';
          }
          if (name && fontUrl) {
            const link = document.createElement('link');
            link.id = 'font-' + name.replace(/\s/g, '-');
            link.rel = 'stylesheet';
            link.href = fontUrl;
            document.head.appendChild(link);
          }
        } catch {}
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { background: #1e1e2e; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      html.theme-boot body { visibility: hidden; }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(ellipse 120% 60% at 50% -10%, var(--page-glow, transparent), transparent);
      }
      #root { position: relative; z-index: 1; }
      /* Prism token colors */
      .token.keyword { color: #c678dd; }
      .token.string, .token.template-string { color: #98c379; }
      .token.function { color: #61afef; }
      .token.number { color: #d19a66; }
      .token.operator, .token.punctuation { opacity: 0.7; }
      .token.comment { opacity: 0.4; font-style: italic; }
      .token.property { color: #e5c07b; }
      .token.builtin { color: #56b6c2; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
